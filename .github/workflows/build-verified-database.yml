name: Build verified Fantacalcio database

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: verified-fantacalcio-build
  cancel-in-progress: true

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_PATH: data/database-fantacalcio.sqlite
      WEB_DATA_PATH: pages/data/database.json
      COVERAGE_REPORT_PATH: reports/pipeline_coverage_report.json
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize clean database
        run: |
          rm -f "$DATABASE_PATH"
          mkdir -p data reports pages/data
          python pipeline.py --init
      - name: Run blocks 1 to 8
        run: |
          python src/block_1_import_entities.py
          python src/block_2_import_matches.py
          python src/block_3_import_player_statistics.py
          python src/block_4_build_fantasy_metrics.py
          python src/block_5_build_advanced_metrics.py
          python src/block_6_import_injuries_transfers.py
          python src/block_7_build_proprietary_indexes.py
          python src/block_8_build_lineup_readiness.py
      - name: Run remaining blocks when available
        run: |
          if [ -f src/build_blocks_9_16.py ]; then python src/build_blocks_9_16.py; fi
      - name: Validate API responses repair links and try secondary source
        run: python src/pipeline_quality_guard.py
      - name: Validate database
        run: python pipeline.py --validate
      - name: Export complete data for web app
        run: python src/export_web_database_v2.py
      - name: Upload database and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: verified-fantacalcio-database
          path: |
            data/database-fantacalcio.sqlite
            reports/*.json
          retention-days: 30
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
