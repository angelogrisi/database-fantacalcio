name: Block 6 - Serie A injuries and transfers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
      THESPORTSDB_API_KEY: "123"
      DATABASE_PATH: data/database-fantacalcio.sqlite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        run: python pipeline.py --init

      - name: Run Block 1
        run: python src/block_1_import_entities.py

      - name: Run Block 2
        run: python src/block_2_import_matches.py

      - name: Run Block 3
        run: python src/block_3_import_player_statistics.py

      - name: Run Block 4
        run: python src/block_4_build_fantasy_metrics.py

      - name: Run Block 5
        run: python src/block_5_build_advanced_metrics.py

      - name: Run Block 6
        run: python src/block_6_import_injuries_transfers.py

      - name: Validate database
        run: python pipeline.py --validate

      - name: Upload database and report
        uses: actions/upload-artifact@v4
        with:
          name: serie-a-fantacalcio-block-6
          path: |
            data/database-fantacalcio.sqlite
            reports/block_6_coverage_report.json
          retention-days: 30
